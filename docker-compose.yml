version: '3.9'
services:
  nginx:
    image: nginx:latest
    ports:
      - "8083:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - lempnet
  php:
    build: ./php
    volumes:
      - ./www:/var/www/html
    networks:
      - lempnet
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exampledb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lempnet
  jenkins:
    container_name: jenkins
    image: jenkins/jenkins
    ports:
      - "8088:8080"
    volumes:
      - $PWD/jenkins_home:/var/jenkins_home
    networks:
      - lempnet

volumes:
  db_data:
  jenkins_home:

networks:
  lempnet:
